name: Deploy to Public Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to public workbench repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add deploy https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/jiyi5378/workbench.git
          git push -f deploy main
